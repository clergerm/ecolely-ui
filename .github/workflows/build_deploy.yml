name: Build and Deploy

on:
  push:
  pull_request:
    branches: [main, develop]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, test, prod]

      deploy:
        description: "Deploy?"
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # Build and Push Docker Image to ECR
  build:
    name: Build & Push UI Docker Image
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com # Default
          role-to-assume: ${{ vars.ECS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if image exists in ECR
        id: check-image
        shell: bash
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            >/dev/null 2>&1
          then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists in ECR."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image does not exist in ECR."
          fi

      - name: Build Docker image
        if: steps.check-image.outputs.exists == 'false'
        run: |
          docker build \
          -t ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Push Docker image to ECR
        if: steps.check-image.outputs.exists == 'false'
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    # Deploy only for manual runs when deploy is true.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    name: Deploy UI to ECS
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_DEFINITION: .aws/task-definition.json
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com # Default
          role-to-assume: ${{ vars.ECS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update ECS task definition image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: ${{ inputs.environment == 'prod' }}